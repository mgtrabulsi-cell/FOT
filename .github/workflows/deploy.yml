name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Test offline persistence
        run: node --test scripts/*offline*.test.mjs scripts/notification-routing.test.mjs scripts/livewire-*.test.mjs scripts/median-navigation.test.mjs scripts/swipe-back.test.mjs scripts/the-angle.test.mjs scripts/angle-history.test.mjs scripts/analyst-reads.test.mjs scripts/matchup-board.test.mjs scripts/player-dialog.test.mjs scripts/nfl-situation.test.mjs scripts/team-comparison-ranks.test.mjs
      - name: Test X publishing
        run: node --test scripts/x-posting.test.mjs
      - name: Test Start/Sit graphics
        run: node --test scripts/fantasy-graphics.test.mjs scripts/fantasy-graphic-drafts.test.mjs
      - name: Test results sport filters
        run: node --test scripts/results-filter.test.mjs
      - name: Test foreground score refresh
        run: node --test scripts/foreground-refresh.test.mjs
      - name: Test Start/Sit roster gateway
        run: npx --yes deno test --config supabase/functions/send-x-posts/deno.json supabase/functions/fantasy-roster/index.test.ts
      - name: Test X dispatcher
        run: npx --yes deno test --config supabase/functions/send-x-posts/deno.json --allow-env --allow-read supabase/functions/send-x-posts/index.test.ts supabase/functions/send-x-posts/analysisImages.test.ts
      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
